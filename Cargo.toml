# Exact Mf Joined Sol App's native workspace, generated by exact2 from app.json: never edited, rewritten
# when the manifest's platforms or the checkout change. An app that needs Rust of its own writes a Cargo.toml of its
# own beside app.json, which is used instead.
[workspace]
members = ["native/web", "native/apple"]
# These dependencies own independent workspaces; Cargo must not adopt them through the local link.
exclude = [
    ".exact/runtime",
    ".exact/runtime/vendor/ibex/crates/ibex2",
    ".exact/runtime/vendor/ibex/crates/hermes-lean-sys",
    ".exact/runtime/vendor/ibex/crates/ibex2-sqlite",
    "reference-repos",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
accesskit_windows = { path = ".exact/runtime/vendor/accesskit-windows" }
taffy = { path = ".exact/runtime/vendor/taffy" }
parley = { path = ".exact/runtime/vendor/parley" }
fontique = { path = ".exact/runtime/vendor/fontique" }
wgpu-hal = { path = ".exact/runtime/vendor/wgpu-hal" }
