# Exact Mf Joined Sol App's native workspace, generated by exact2 from app.json: never edited, rewritten
# when the manifest's platforms or the checkout change. An app that needs Rust of its own writes a Cargo.toml of its
# own beside app.json, which is used instead.
[workspace]
members = ["native/web", "native/apple"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
accesskit_windows = { path = "/Users/zackarychapple/code/t3/exact/vendor/accesskit-windows" }
taffy = { path = "/Users/zackarychapple/code/t3/exact/vendor/taffy" }
parley = { path = "/Users/zackarychapple/code/t3/exact/vendor/parley" }
fontique = { path = "/Users/zackarychapple/code/t3/exact/vendor/fontique" }
wgpu-hal = { path = "/Users/zackarychapple/code/t3/exact/vendor/wgpu-hal" }
